<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent</title>
<style>
  :root {
    --accent: __ACCENT_COLOR__;
    --bg: #fff;
    --text: #6b6375;
    --text-h: #08060d;
    --border: #e5e4e7;
    --code-bg: #f4f3ec;
    --accent-bg: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171d;
      --text: #9ca3af;
      --text-h: #f3f4f6;
      --border: #2e303a;
      --code-bg: #1f2028;
      --accent-bg: color-mix(in srgb, var(--accent) 20%, transparent);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100svh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    color: var(--text-h);
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-bg);
    color: var(--text-h);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--code-bg);
    color: var(--text-h);
  }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .msg code {
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.9em;
  }
  .msg sup {
    font-size: 0.7em;
    vertical-align: super;
    line-height: 0;
  }
  .msg .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 2px;
    font-size: 0.85em;
    line-height: 1.1;
  }
  .msg .frac-num {
    border-bottom: 1px solid currentColor;
    padding: 0 3px;
  }
  .msg .frac-den {
    padding: 0 3px;
  }
  /* MathJax renders to SVG. currentColor makes the glyphs take the bubble's
     colour instead of defaulting to black on a dark theme. */
  .msg mjx-container svg { color: inherit; fill: currentColor; }
  .msg mjx-container { color: inherit; }
  .msg .math { white-space: normal; }
  /* MathJax emits a parallel MathML copy for screen readers. It relies on
     being clipped out of view, which this bubble's `white-space: pre-wrap`
     defeats — the result is every equation rendered twice, once as SVG and
     once as raw text. Clip it explicitly rather than turning the feature off,
     so assistive tech still reads the maths. */
  .msg mjx-assistive-mml {
    position: absolute !important;
    top: 0;
    left: 0;
    clip: rect(1px, 1px, 1px, 1px);
    width: 1px !important;
    height: 1px !important;
    padding: 0 !important;
    border: 0 !important;
    overflow: hidden !important;
    white-space: nowrap !important;
    display: block !important;
  }
  /* Display maths gets its own scroller — a long equation must never widen
     the page. */
  .msg .math-display {
    display: block;
    margin: 8px 0;
    overflow-x: auto;
    overflow-y: hidden;
    text-align: center;
  }

  /* Footer listing the tools a reply used. */
  .msg-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-top: 9px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    white-space: normal;
  }
  .msg-tools-label {
    color: var(--text);
    opacity: 0.75;
    letter-spacing: 0.03em;
  }
  .tool-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent-bg);
    color: var(--text-h);
    border: 1px solid var(--border);
  }
  .tool-chip::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }
  .tool-chip.failed { opacity: 0.75; }
  .tool-chip.failed::before { background: #d2504a; }
  .msg.typing {
    gap: 6px;
  }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 2px 0;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    animation: typing-bounce 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  /* The live activity line. Shown outright rather than behind a disclosure —
     "what is it doing" is the question the spinner already raises, so making
     the answer a click away just hides the most reassuring thing on screen. */
  .typing-status-text {
    margin-top: 5px;
    color: var(--text);
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .typing-status-text::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
    animation: status-pulse 1.4s ease-in-out infinite;
  }
  @keyframes status-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .typing-status-text::before { animation: none; opacity: 0.8; }
  }
  #extra-inputs {
    padding: 0 20px;
  }
  #image-upload-row {
    display: none;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
  }
  body[data-image-upload="true"] #image-upload-row {
    display: flex;
  }
  #image-upload-row button {
    background: var(--code-bg);
    color: var(--text-h);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #image-preview-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  #image-preview-wrap.active {
    display: flex;
  }
  #image-preview {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  #image-remove-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-h);
  }
  #chat-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
<!-- Agent-specific generated theme. Emitted last so it overrides the base
     variables above, and deliberately limited to :root variables, body
     font/background and a fixed set of decorative patterns — the layout and
     chat behaviour above can't be reached from here. -->
<style>
  __AGENT_THEME_CSS__
</style>
<!-- Full TeX, via MathJax. KaTeX was here first and is faster, but it
     implements a SUBSET of LaTeX — it rejects the AMS environments a maths
     agent reaches for constantly (align, cases, matrices), \newcommand, and
     much of amsmath. MathJax's TeX input handles those, which is the whole
     point of putting maths on the page.

     Loaded from a CDN rather than vendored into every agent image, and
     entirely optional: if it fails to load, renderRichText's own macro
     substitution still runs, so maths degrades to approximate rather than to
     raw source. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"], ["$$", "$$"]],
      processEscapes: true,
      // The AMS packages are the reason for choosing MathJax over KaTeX.
      packages: { "[+]": ["ams", "newcommand", "noerrors", "noundefined"] },
    },
    // The page renders maths itself, span by span, from stashed source — a
    // global typeset pass would also rewrite user text that merely looks like
    // maths.
    startup: {
      typeset: false,
      ready: () => {
        window.MathJax.startup.defaultReady();
        document.dispatchEvent(new Event("mathjax-ready"));
      },
    },
    options: { enableMenu: false },
  };
</script>
<script
  defer
  id="MathJax-script"
  src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"
  crossorigin="anonymous"
></script>
</head>
<body data-image-upload="__IMAGE_UPLOAD_ENABLED__">
  <header>
    <h1>Agent</h1>
    <p>Ask it anything.</p>
  </header>

  <div id="messages"></div>

  <!-- Agent-specific extra inputs can be added here. -->
  <div id="extra-inputs">
    <div id="image-upload-row">
      <input id="image-input" type="file" accept="image/*" style="display: none" />
      <button id="image-upload-btn" type="button">📷 Attach image</button>
      <div id="image-preview-wrap">
        <img id="image-preview" alt="Selected image preview" />
        <button id="image-remove-btn" type="button" title="Remove image">×</button>
      </div>
    </div>
  </div>

  <div id="input-row">
    <input id="chat-input" type="text" placeholder="Type a message…" autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const imageInput = document.getElementById("image-input");
    const imageUploadBtn = document.getElementById("image-upload-btn");
    const imagePreviewWrap = document.getElementById("image-preview-wrap");
    const imagePreview = document.getElementById("image-preview");
    const imageRemoveBtn = document.getElementById("image-remove-btn");
    const history = [];
    let pendingImage = null; // { data, media_type, dataUrl }

    // --- Lightweight rich-text rendering: bold/italic/code, superscripts,
    // and a small subset of LaTeX (\frac, \sqrt, greek letters, common
    // symbols) — no external libraries, so the page stays self-contained. ---
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    const GREEK = {
      alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", zeta: "ζ",
      eta: "η", theta: "θ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ",
      nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ",
      phi: "φ", chi: "χ", psi: "ψ", omega: "ω",
      Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π",
      Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω",
    };
    const SYMBOLS = {
      times: "×", div: "÷", pm: "±", mp: "∓", cdot: "·",
      leq: "≤", geq: "≥", neq: "≠", approx: "≈", infty: "∞",
      rightarrow: "→", leftarrow: "←", sum: "∑", int: "∫", partial: "∂",
    };

    // Approximate math, used when KaTeX isn't available and for expressions
    // written without delimiters at all (models frequently just type x^2).
    function approximateMath(html) {
      html = html.replace(
        /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
        '<span class="frac"><span class="frac-num">$1</span><span class="frac-den">$2</span></span>'
      );
      html = html.replace(/\\sqrt\{([^{}]+)\}/g, "√($1)");
      html = html.replace(/\\([A-Za-z]+)/g, (m, name) => GREEK[name] || SYMBOLS[name] || m);
      html = html.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
      html = html.replace(/\^(-?\w+)/g, "<sup>$1</sup>");
      html = html.replace(/_\{([^{}]+)\}/g, "<sub>$1</sub>");
      html = html.replace(/_(-?\w+)/g, "<sub>$1</sub>");
      return html;
    }

    // Math is pulled out BEFORE anything else touches the string. The markdown
    // passes below would otherwise eat parts of it — \times becomes ×, a ^ in
    // an exponent becomes <sup>, and `*` inside a matrix reads as emphasis —
    // and KaTeX needs the original source, not a half-substituted version.
    function renderRichText(raw) {
      const math = [];
      const stash = (tex, display) => "\u0001M" + (math.push({ tex, display }) - 1) + "\u0001";

      let s = String(raw)
        .replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => stash(t, true))
        .replace(/\\\[([\s\S]+?)\\\]/g, (m, t) => stash(t, true))
        .replace(/\\\(([\s\S]+?)\\\)/g, (m, t) => stash(t, false))
        .replace(/\$([^$\n]+?)\$/g, (m, t) => stash(t, false));

      s = escapeHtml(s);

      // bold, italic, inline code
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Undelimited math in ordinary prose still gets the approximate pass.
      s = approximateMath(s);

      // Put the math back as inert spans carrying their own source, so
      // typesetMath can render them — and re-render them later if KaTeX
      // finishes loading after the message was already on screen.
      s = s.replace(/\u0001M(\d+)\u0001/g, (m, i) => {
        const item = math[Number(i)];
        return (
          '<span class="math" data-display="' +
          (item.display ? "1" : "0") +
          '" data-tex="' +
          escapeHtml(item.tex).replace(/"/g, "&quot;") +
          '"></span>'
        );
      });
      return s;
    }

    function typesetMath(root) {
      const ready = window.MathJax && window.MathJax.tex2svgPromise;
      root.querySelectorAll("span.math").forEach((el) => {
        const tex = el.dataset.tex || "";
        const display = el.dataset.display === "1";
        if (ready) {
          // tex2svgPromise renders one expression from source, which is what
          // this page needs — the alternative, typesetting the whole subtree,
          // would also reinterpret ordinary prose that happens to contain $.
          window.MathJax.tex2svgPromise(tex, { display })
            .then((node) => {
              el.textContent = "";
              el.appendChild(node);
              el.classList.toggle("math-display", display);
            })
            .catch(() => {
              el.innerHTML = approximateMath(escapeHtml(tex));
            });
          return;
        }
        el.innerHTML = approximateMath(escapeHtml(tex));
      });
    }

    // MathJax is deferred, so early messages render approximate first;
    // re-typeset once it lands. data-tex keeps the source, so this is idempotent.
    document.addEventListener("mathjax-ready", () => typesetMath(document));

    // `tools` is the list this turn actually used, newest reply only. Omitted
    // entirely when the model answered without calling anything — a permanent
    // "Tools used: none" row would be noise on most messages.
    function appendMessage(role, content, imageDataUrl, tools) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (imageDataUrl) {
        const img = document.createElement("img");
        img.src = imageDataUrl;
        div.appendChild(img);
      }
      const text = document.createElement("span");
      text.innerHTML = renderRichText(content);
      typesetMath(text);
      div.appendChild(text);

      if (tools && tools.length) {
        const footer = document.createElement("div");
        footer.className = "msg-tools";
        const label = document.createElement("span");
        label.className = "msg-tools-label";
        label.textContent = tools.length === 1 ? "Used" : "Used " + tools.length + " tools:";
        footer.appendChild(label);
        tools.forEach((t) => {
          const chip = document.createElement("span");
          chip.className = "tool-chip" + (t.ok === false ? " failed" : "");
          chip.textContent = t.name;
          if (t.ok === false) chip.title = "This call failed";
          footer.appendChild(chip);
        });
        div.appendChild(footer);
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    let statusPollTimer = null;

    function addTypingBubble() {
      const div = document.createElement("div");
      div.className = "msg assistant typing";
      div.innerHTML =
        '<div class="typing-dots"><span></span><span></span><span></span></div>' +
        '<div class="typing-status-text">Reading your message…</div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function startStatusPolling(bubble) {
      const statusText = bubble.querySelector(".typing-status-text");
      async function poll() {
        try {
          const res = await fetch("/chat/status");
          const data = await res.json();
          if (statusText && data.status && data.status !== "idle") {
            statusText.textContent = data.status;
          }
        } catch (e) {
          // best-effort — a missed poll just means stale status text for a beat
        }
        statusPollTimer = setTimeout(poll, 600);
      }
      poll();
    }

    function stopStatusPolling() {
      if (statusPollTimer) clearTimeout(statusPollTimer);
      statusPollTimer = null;
    }

    function clearPendingImage() {
      pendingImage = null;
      imageInput.value = "";
      imagePreviewWrap.classList.remove("active");
    }

    imageUploadBtn?.addEventListener("click", () => imageInput.click());

    imageInput?.addEventListener("change", () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const [, mediaType, , base64] = dataUrl.match(/^data:(.+);(base64),(.*)$/) || [];
        if (!base64) return;
        pendingImage = { data: base64, media_type: mediaType, dataUrl };
        imagePreview.src = dataUrl;
        imagePreviewWrap.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    imageRemoveBtn?.addEventListener("click", clearPendingImage);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !pendingImage) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text, pendingImage?.dataUrl);
      history.push({ role: "user", content: text });
      const image = pendingImage ? { data: pendingImage.data, media_type: pendingImage.media_type } : null;
      clearPendingImage();

      const typingBubble = addTypingBubble();
      startStatusPolling(typingBubble);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history, image }),
        });
        const data = await response.json();
        stopStatusPolling();
        typingBubble.remove();
        if (!response.ok) throw new Error(data.detail || "Request failed");
        appendMessage("assistant", data.reply, null, data.tools);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        stopStatusPolling();
        typingBubble.remove();
        appendMessage("assistant", "Error: " + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    inputEl.focus();
  </script>
</body>
</html>
