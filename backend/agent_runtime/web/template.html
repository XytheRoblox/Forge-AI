<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent</title>
<style>
  :root {
    --accent: __ACCENT_COLOR__;
    --bg: #fff;
    --text: #6b6375;
    --text-h: #08060d;
    --border: #e5e4e7;
    --code-bg: #f4f3ec;
    --accent-bg: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171d;
      --text: #9ca3af;
      --text-h: #f3f4f6;
      --border: #2e303a;
      --code-bg: #1f2028;
      --accent-bg: color-mix(in srgb, var(--accent) 20%, transparent);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100svh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    color: var(--text-h);
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    display: flex;
    flex-direction: column;
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent-bg);
    color: var(--text-h);
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--code-bg);
    color: var(--text-h);
  }
  .msg img {
    max-width: 100%;
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .msg code {
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.9em;
  }
  .msg sup {
    font-size: 0.7em;
    vertical-align: super;
    line-height: 0;
  }
  .msg .frac {
    display: inline-flex;
    flex-direction: column;
    vertical-align: middle;
    text-align: center;
    margin: 0 2px;
    font-size: 0.85em;
    line-height: 1.1;
  }
  .msg .frac-num {
    border-bottom: 1px solid currentColor;
    padding: 0 3px;
  }
  .msg .frac-den {
    padding: 0 3px;
  }
  .msg.typing {
    gap: 6px;
  }
  .typing-dots {
    display: flex;
    gap: 4px;
    padding: 2px 0;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.35;
    animation: typing-bounce 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typing-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-4px); opacity: 1; }
  }
  .typing-status {
    font-size: 12px;
  }
  .typing-status summary {
    cursor: pointer;
    color: var(--text);
    list-style: none;
  }
  .typing-status summary::-webkit-details-marker { display: none; }
  .typing-status summary::before { content: "▸ "; }
  .typing-status[open] summary::before { content: "▾ "; }
  .typing-status-text {
    margin-top: 4px;
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 11px;
  }
  #extra-inputs {
    padding: 0 20px;
  }
  #image-upload-row {
    display: none;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
  }
  body[data-image-upload="true"] #image-upload-row {
    display: flex;
  }
  #image-upload-row button {
    background: var(--code-bg);
    color: var(--text-h);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  #image-preview-wrap {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
  }
  #image-preview-wrap.active {
    display: flex;
  }
  #image-preview {
    width: 32px;
    height: 32px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  #image-remove-btn {
    background: none;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
  }
  #input-row {
    display: flex;
    gap: 8px;
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1;
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-h);
  }
  #chat-input:focus { outline: none; border-color: var(--accent); }
  #send-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
<!-- Agent-specific generated theme. Emitted last so it overrides the base
     variables above, and deliberately limited to :root variables, body
     font/background and a fixed set of decorative patterns — the layout and
     chat behaviour above can't be reached from here. -->
<style>
  __AGENT_THEME_CSS__
</style>
</head>
<body data-image-upload="__IMAGE_UPLOAD_ENABLED__">
  <header>
    <h1>Agent</h1>
    <p>Ask it anything.</p>
  </header>

  <div id="messages"></div>

  <!-- Agent-specific extra inputs can be added here. -->
  <div id="extra-inputs">
    <div id="image-upload-row">
      <input id="image-input" type="file" accept="image/*" style="display: none" />
      <button id="image-upload-btn" type="button">📷 Attach image</button>
      <div id="image-preview-wrap">
        <img id="image-preview" alt="Selected image preview" />
        <button id="image-remove-btn" type="button" title="Remove image">×</button>
      </div>
    </div>
  </div>

  <div id="input-row">
    <input id="chat-input" type="text" placeholder="Type a message…" autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const imageInput = document.getElementById("image-input");
    const imageUploadBtn = document.getElementById("image-upload-btn");
    const imagePreviewWrap = document.getElementById("image-preview-wrap");
    const imagePreview = document.getElementById("image-preview");
    const imageRemoveBtn = document.getElementById("image-remove-btn");
    const history = [];
    let pendingImage = null; // { data, media_type, dataUrl }

    // --- Lightweight rich-text rendering: bold/italic/code, superscripts,
    // and a small subset of LaTeX (\frac, \sqrt, greek letters, common
    // symbols) — no external libraries, so the page stays self-contained. ---
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    const GREEK = {
      alpha: "α", beta: "β", gamma: "γ", delta: "δ", epsilon: "ε", zeta: "ζ",
      eta: "η", theta: "θ", iota: "ι", kappa: "κ", lambda: "λ", mu: "μ",
      nu: "ν", xi: "ξ", pi: "π", rho: "ρ", sigma: "σ", tau: "τ",
      phi: "φ", chi: "χ", psi: "ψ", omega: "ω",
      Gamma: "Γ", Delta: "Δ", Theta: "Θ", Lambda: "Λ", Xi: "Ξ", Pi: "Π",
      Sigma: "Σ", Phi: "Φ", Psi: "Ψ", Omega: "Ω",
    };
    const SYMBOLS = {
      times: "×", div: "÷", pm: "±", mp: "∓", cdot: "·",
      leq: "≤", geq: "≥", neq: "≠", approx: "≈", infty: "∞",
      rightarrow: "→", leftarrow: "←", sum: "∑", int: "∫", partial: "∂",
    };

    function renderRichText(raw) {
      let html = escapeHtml(raw);

      // Strip math delimiters, keep their contents for the rules below.
      html = html.replace(/\$\$([\s\S]+?)\$\$/g, "$1");
      html = html.replace(/\$([^$\n]+?)\$/g, "$1");
      html = html.replace(/\\\[([\s\S]+?)\\\]/g, "$1");
      html = html.replace(/\\\(([\s\S]+?)\\\)/g, "$1");

      // \frac{a}{b}
      html = html.replace(
        /\\frac\{([^{}]+)\}\{([^{}]+)\}/g,
        '<span class="frac"><span class="frac-num">$1</span><span class="frac-den">$2</span></span>'
      );
      // \sqrt{x}
      html = html.replace(/\\sqrt\{([^{}]+)\}/g, "√($1)");
      // greek letters + common symbol macros
      html = html.replace(/\\([A-Za-z]+)/g, (m, name) => GREEK[name] || SYMBOLS[name] || m);

      // bold, italic, inline code
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/(^|[^*])\*([^*]+)\*(?!\*)/g, "$1<em>$2</em>");
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

      // superscripts: ^{...} or ^word
      html = html.replace(/\^\{([^{}]+)\}/g, "<sup>$1</sup>");
      html = html.replace(/\^(-?\w+)/g, "<sup>$1</sup>");

      return html;
    }

    function appendMessage(role, content, imageDataUrl) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      if (imageDataUrl) {
        const img = document.createElement("img");
        img.src = imageDataUrl;
        div.appendChild(img);
      }
      const text = document.createElement("span");
      text.innerHTML = renderRichText(content);
      div.appendChild(text);
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    let statusPollTimer = null;

    function addTypingBubble() {
      const div = document.createElement("div");
      div.className = "msg assistant typing";
      div.innerHTML =
        '<div class="typing-dots"><span></span><span></span><span></span></div>' +
        '<details class="typing-status"><summary>What\'s it doing?</summary>' +
        '<div class="typing-status-text">Reading your message…</div></details>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function startStatusPolling(bubble) {
      const statusText = bubble.querySelector(".typing-status-text");
      async function poll() {
        try {
          const res = await fetch("/chat/status");
          const data = await res.json();
          if (statusText && data.status && data.status !== "idle") {
            statusText.textContent = data.status;
          }
        } catch (e) {
          // best-effort — a missed poll just means stale status text for a beat
        }
        statusPollTimer = setTimeout(poll, 600);
      }
      poll();
    }

    function stopStatusPolling() {
      if (statusPollTimer) clearTimeout(statusPollTimer);
      statusPollTimer = null;
    }

    function clearPendingImage() {
      pendingImage = null;
      imageInput.value = "";
      imagePreviewWrap.classList.remove("active");
    }

    imageUploadBtn?.addEventListener("click", () => imageInput.click());

    imageInput?.addEventListener("change", () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const [, mediaType, , base64] = dataUrl.match(/^data:(.+);(base64),(.*)$/) || [];
        if (!base64) return;
        pendingImage = { data: base64, media_type: mediaType, dataUrl };
        imagePreview.src = dataUrl;
        imagePreviewWrap.classList.add("active");
      };
      reader.readAsDataURL(file);
    });

    imageRemoveBtn?.addEventListener("click", clearPendingImage);

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text && !pendingImage) return;
      inputEl.value = "";
      sendBtn.disabled = true;
      appendMessage("user", text, pendingImage?.dataUrl);
      history.push({ role: "user", content: text });
      const image = pendingImage ? { data: pendingImage.data, media_type: pendingImage.media_type } : null;
      clearPendingImage();

      const typingBubble = addTypingBubble();
      startStatusPolling(typingBubble);

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history, image }),
        });
        const data = await response.json();
        stopStatusPolling();
        typingBubble.remove();
        if (!response.ok) throw new Error(data.detail || "Request failed");
        appendMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        stopStatusPolling();
        typingBubble.remove();
        appendMessage("assistant", "Error: " + err.message);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
    inputEl.focus();
  </script>
</body>
</html>
